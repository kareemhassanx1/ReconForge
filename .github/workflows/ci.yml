name: CI

on:
  push:
    branches: [main, 'recovery/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install project and development tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation -e .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Check source types
        run: python -m mypy

      - name: Run tests with branch coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report

      - name: Build and verify isolated installed wheel
        run: |
          python -m pip wheel --no-index --no-deps --no-build-isolation --wheel-dir dist .
          python scripts/verify_package.py "dist/*.whl"

  dependency-container:
    name: Offline supplied-checkout Docker verification
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build dependency-only image
        run: docker build --tag reconforge-deps:ci .
      - name: Test supplied checkout without network access
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/checkout,readonly" \
            --tmpfs /work:exec reconforge-deps:ci sh -ec '
              cp -R /checkout/. /work/
              cd /work
              python -m pip install --no-index --no-deps --no-build-isolation .
              python -m pip check
              python -m coverage run -m pytest -q
              python -m coverage report
              python -m pip wheel --no-index --no-deps --no-build-isolation --wheel-dir /tmp/wheels .
              python scripts/verify_package.py "/tmp/wheels/*.whl"
            '
